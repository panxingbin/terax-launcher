<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="net-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <!-- main body -->
  <rect x="3" y="2" width="10" height="12" rx="2" fill="url(#net-g)"/>
  <!-- screen -->
  <rect x="4" y="3" width="8" height="8" rx="0.5" fill="#1E1B4B"/>
  <!-- terminal lines -->
  <rect x="5" y="4.5" width="4" height="0.8" rx="0.4" fill="#A5B4FC"/>
  <rect x="5" y="6" width="6" height="0.8" rx="0.4" fill="#818CF8"/>
  <rect x="5" y="7.5" width="3" height="0.8" rx="0.4" fill="#6366F1"/>
  <rect x="5" y="9" width="5" height="0.8" rx="0.4" fill="#A5B4FC"/>
  <!-- antenna -->
  <line x1="8" y1="0.5" x2="8" y2="2" stroke="#4338CA" stroke-width="0.8"/>
  <circle cx="8" cy="0.4" r="0.5" fill="#4338CA"/>
  <!-- base -->
  <rect x="4.5" y="11.5" width="7" height="1.5" rx="0.5" fill="#312E81"/>
</svg>
