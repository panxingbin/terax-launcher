<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- gear/cog background -->
  <circle cx="8" cy="8" r="6" fill="#6B7280"/>
  <circle cx="8" cy="8" r="4.5" fill="#9CA3AF"/>
  <!-- gear teeth -->
  <rect x="7.2" y="2.5" width="1.6" height="3" rx="0.3" fill="#6B7280"/>
  <rect x="7.2" y="10.5" width="1.6" height="3" rx="0.3" fill="#6B7280"/>
  <rect x="2.5" y="7.2" width="3" height="1.6" rx="0.3" fill="#6B7280"/>
  <rect x="10.5" y="7.2" width="3" height="1.6" rx="0.3" fill="#6B7280"/>
  <!-- diagonal teeth -->
  <rect x="4" y="4" width="1.6" height="2.2" rx="0.3" fill="#6B7280" transform="rotate(45 4.8 5)"/>
  <rect x="10" y="4" width="1.6" height="2.2" rx="0.3" fill="#6B7280" transform="rotate(-45 10.8 5)"/>
  <rect x="4" y="10" width="1.6" height="2.2" rx="0.3" fill="#6B7280" transform="rotate(-45 4.8 11)"/>
  <rect x="10" y="10" width="1.6" height="2.2" rx="0.3" fill="#6B7280" transform="rotate(45 10.8 11)"/>
  <!-- center hole -->
  <circle cx="8" cy="8" r="2" fill="#374151"/>
</svg>
